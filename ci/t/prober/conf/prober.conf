# Server layout the prober rules assume. Loaded by ci/t/prober/run.sh, which
# substitutes @LOAD@ and @PORT@.
#
# ONE zone and ONE probe endpoint. The prober arms faults and reads state
# through a single URI for the whole run (prober.c's opt_probe_uri, settable
# only with -u), so a second error_abuse_probe location would never receive a
# `fault` line -- the arming request would land on the first endpoint and the
# case would silently test the wrong zone. on_full is a ZONE parameter, so the
# on_full=reject half needs its own conf and its own run: see
# conf/prober-reject.conf.
#
# The block is enforced in the PREACCESS phase, and `return` is handled in the
# rewrite phase and finalizes before preaccess runs -- so a location whose
# response must be counted AND then rejected cannot use `return`. The counted
# locations therefore proxy to 127.0.0.1:1, which nothing listens on: the
# upstream failure produces a real 502 through the normal content path, which
# the status list counts, and a request the module rejects returns the
# configured status instead. That asymmetry is what tells the two apart.

@LOAD@

daemon off;
master_process on;
worker_processes 1;

error_log logs/error.log info;
pid       logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;

    # threshold is high enough that no rule reaches it by accident: these rules
    # exercise the ZONE-FULL path, not the ban threshold, and a ban firing
    # mid-run would change the status a case sees for an unrelated reason.
    error_abuse_zone zone=probezone:1m key=$binary_remote_addr
                     statuses=502 interval=60s threshold=50 block=600s;

    server {
        listen 127.0.0.1:@PORT@;
        server_name prober;

        # on_full=allow (the default): a new identity that cannot be tracked
        # passes through untracked, so the client still sees the upstream 502.
        location /counted {
            error_abuse zone=probezone status=429;
            proxy_pass http://127.0.0.1:1;
        }

        location /__probe {
            error_abuse_probe probezone;
        }
    }
}
