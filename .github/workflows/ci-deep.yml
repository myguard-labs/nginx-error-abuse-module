name: CI Deep

# Exhaustive dynamic analysis — monthly cron + on-demand only, NEVER on PR.
# The PR-time gates live in the standalone fuzzing.yml (fast fuzz regression),
# valgrind.yml (memcheck lite soak) and security-scanners.yml workflows; THIS
# file remains the exhaustive monthly+dispatch sweep. codeql.yml is dropped
# entirely: CodeQL / the GitHub Security tab is GitHub-Advanced-Security only
# and does nothing on a private repo, so the SARIF-upload path is removed too
# — the scanners still run and GATE on findings, they just don't upload.
#
# Jobs: fuzz (14400s/target) · memcheck soak · helgrind soak · scanners.
#   * memcheck AND helgrind run under ci/tools/soak.sh, which passes
#     --suppressions=ci/tools/valgrind.supp for BOTH tools and
#     --error-exitcode=99 (see ci/tools/soak.sh) — the drift-fix baseline for
#     every module.
#
# Action pins (keep in sync with build-test.yml header):
# actions/checkout@v5        -> 93cb6efe18208431cddfb8368fd83d5badbf9bfd
# actions/upload-artifact@v5 -> 330a01c490aca151604b8cf639adc76d48f6c5d4

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NGINX_VERSION: ""

on:
  schedule:
    # Monthly, day 4 @ 03:30 UTC — staggered per repo so ci-deep runs
    # don't pile up on the shared self-hosted runners.
    - cron: "30 3 4 * *"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "Per-target fuzz duration (seconds)"
        required: false
        default: "3600"

concurrency:
  group: ci-deep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (all targets, long)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","builder02","lxc"]') }}
    timeout-minutes: 600
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install clang + libFuzzer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang build-essential curl libhiredis-dev libpcre2-dev zlib1g-dev

      # The fuzz targets link the module's real scan TU and nginx's real
      # src/core/ngx_string.c, so this job needs a CONFIGURED nginx tree for
      # objs/ngx_auto_config.h. Same mainline resolution the deep soak jobs
      # below use, so the long fuzz runs against the same nginx they do.
      # Was: scrape nginx.org for the highest version and build whatever came
      # back -- unreproducible (same commit, different nginx on different days)
      # and unverifiable (a run-time version has no digest to check against).
      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      # cp7a: version is resolved dynamically above, so the cache key changes
      # with it -- correct, since a new mainline release IS a new build tree.
      - name: Restore build caches
        uses: ./.github/actions/build-cache
        with:
          mode: module
          nginx-version: ${{ env.NGINX_VERSION }}

      - name: Configure nginx tree
        run: bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" module

      - name: Select fuzz duration
        # The input is passed through env, not interpolated directly into the
        # run: block -- zizmor's template-injection audit flags the latter
        # because ${{ }} expands BEFORE the shell runs, so an attacker-supplied
        # value becomes shell syntax rather than a string. env: assignment goes
        # through the shell as a normal variable instead.
        #
        # env: alone is not sufficient: the value is still written UNVALIDATED
        # into $GITHUB_ENV below. A value containing a newline injects
        # arbitrary further environment variables into every later step on
        # this self-hosted runner (e.g. LD_PRELOAD=, PATH=); non-numeric junk
        # silently corrupts the fuzz duration. So validate strictly BEFORE
        # writing: require the WHOLE value to match ^[0-9]+$ (grep -z anchors
        # against the full buffer, not per-line -- a plain `grep -qE
        # '^[0-9]+$'` treats an embedded newline as a line boundary and lets
        # the injected payload through), then range-check, then fail the job
        # loudly on any rejection -- never silently fall back to the default,
        # that would hide an attack. printf, not echo, avoids any further
        # escape-sequence surprises.
        env:
          FUZZ_SECONDS_INPUT: ${{ github.event.inputs.fuzz_seconds }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! printf '%s' "${FUZZ_SECONDS_INPUT}" | grep -qzE '^[0-9]+$'; then
              echo "::error::fuzz_seconds must be a plain decimal integer (got invalid/empty/malformed input)"
              exit 1
            fi
            if [ "${FUZZ_SECONDS_INPUT}" -lt 1 ] || [ "${FUZZ_SECONDS_INPUT}" -gt 86400 ]; then
              echo "::error::fuzz_seconds out of range 1..86400 (got ${FUZZ_SECONDS_INPUT})"
              exit 1
            fi
            printf 'FUZZ_SECS=%s\n' "${FUZZ_SECONDS_INPUT}" >> "$GITHUB_ENV"
          else
            printf 'FUZZ_SECS=3600\n' >> "$GITHUB_ENV"
          fi

      - name: Build fuzz targets
        run: bash ci/fuzz/build.sh "$GITHUB_WORKSPACE/ci/fuzz"

      - name: Fuzz each target
        run: |
          set -euo pipefail
          cd ci/fuzz
          # target:corpus[:dict] — snapshot is binary (no dict); statuses is a
          # token grammar so it gets the status-code/range dictionary.
          targets="fuzz_snapshot:corpus: fuzz_statuses:corpus_statuses:fuzz.dict"
          for t in $targets; do
            bin="${t%%:*}"; rest="${t#*:}"; corp="${rest%%:*}"; dict="${rest#*:}"
            args=(-max_total_time="$FUZZ_SECS" -print_final_stats=1 -artifact_prefix="crash-${bin}-")
            [ -n "$dict" ] && args+=("-dict=$dict")
            echo "=== $bin over $corp (${FUZZ_SECS}s)${dict:+ +dict} ==="
            set +e
            "./$bin" "${args[@]}" "$corp/"
            rc=$?
            set -e
            [ $rc -eq 0 ] || { echo "❌ $bin crash (exit $rc)"; exit 1; }
            echo "✓ $bin: no crashes in ${FUZZ_SECS}s"
            mkdir -p "${corp}-min"
            "./$bin" -merge=1 "${corp}-min/" "$corp/"
            echo "merged $corp: $(find "${corp}-min" -type f | wc -l) units"
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: fuzz-deep-crashes
          path: ${{ github.workspace }}/ci/fuzz/crash-*
          retention-days: 30

      - name: Upload minimized corpus
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: fuzz-corpus
          path: ${{ github.workspace }}/ci/fuzz/*-min
          retention-days: 30

      - name: Notify Discord on failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_BUILDS: ${{ secrets.DISCORD_CHANNEL_BUILDS }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_BOT_TOKEN" ] || exit 0
          curl -fsS -X POST -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_BUILDS/messages" \
            -d "{\"content\":\"🔴 ${REPO} — CI Deep / fuzz FAILED. ${RUN_URL}\"}" || true

  memcheck:
    name: Valgrind Memcheck soak
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","builder02","lxc"]') }}
    timeout-minutes: 240
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      # Was: scrape nginx.org for the highest version and build whatever came
      # back -- unreproducible (same commit, different nginx on different days)
      # and unverifiable (a run-time version has no digest to check against).
      - name: Load version pins
        run: bash .github/scripts/load-versions.sh
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl libhiredis-dev libpcre2-dev libssl-dev \
            pkg-config valgrind wget zlib1g-dev
      - name: Build debug nginx + error-abuse module
        run: |
          set -euo pipefail
          # Digest-verified; the bare wget this replaces compiled whatever
          # bytes the network returned.
          bash .github/scripts/fetch-verify.sh \
            "https://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz" \
            "$NGINX_VERSION_SHA256" \
            "nginx-${NGINX_VERSION}.tar.gz"
          tar -xzf "nginx-${NGINX_VERSION}.tar.gz"; cd "nginx-${NGINX_VERSION}"
          ./configure \
            --with-compat --with-debug --with-threads --with-file-aio \
            --with-http_ssl_module --with-http_v2_module \
            --with-http_realip_module --without-http_rewrite_module \
            --with-cc-opt="-DNGX_DEBUG_PALLOC=1 -g3 -O0 -fno-omit-frame-pointer -funwind-tables" \
            --add-module="$GITHUB_WORKSPACE"
          make -j"$(nproc)"
      - name: Memcheck soak (600s @ 4 conc, WITH suppressions)
        env:
          USE_VALGRIND: "1"
        run: |
          bash ci/tools/soak.sh \
            "$GITHUB_WORKSPACE/nginx-${NGINX_VERSION}/objs/nginx" 600 4
      - name: Notify Discord on failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_BUILDS: ${{ secrets.DISCORD_CHANNEL_BUILDS }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_BOT_TOKEN" ] || exit 0
          curl -fsS -X POST -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_BUILDS/messages" \
            -d "{\"content\":\"🔴 ${REPO} — CI Deep / memcheck FAILED. ${RUN_URL}\"}" || true

  helgrind:
    name: Valgrind Helgrind soak
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","builder02","lxc"]') }}
    timeout-minutes: 240
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      # Was: scrape nginx.org for the highest version and build whatever came
      # back -- unreproducible (same commit, different nginx on different days)
      # and unverifiable (a run-time version has no digest to check against).
      - name: Load version pins
        run: bash .github/scripts/load-versions.sh
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl libhiredis-dev libpcre2-dev libssl-dev \
            pkg-config valgrind wget zlib1g-dev
      - name: Build debug nginx + error-abuse module
        run: |
          set -euo pipefail
          # Digest-verified; the bare wget this replaces compiled whatever
          # bytes the network returned.
          bash .github/scripts/fetch-verify.sh \
            "https://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz" \
            "$NGINX_VERSION_SHA256" \
            "nginx-${NGINX_VERSION}.tar.gz"
          tar -xzf "nginx-${NGINX_VERSION}.tar.gz"; cd "nginx-${NGINX_VERSION}"
          ./configure \
            --with-compat --with-debug --with-threads --with-file-aio \
            --with-http_ssl_module --with-http_v2_module \
            --with-http_realip_module --without-http_rewrite_module \
            --with-cc-opt="-DNGX_DEBUG_PALLOC=1 -g3 -O0 -fno-omit-frame-pointer -funwind-tables" \
            --add-module="$GITHUB_WORKSPACE"
          make -j"$(nproc)"
      - name: Helgrind soak (600s @ 4 conc, --error-exitcode=99, WITH suppressions)
        env:
          USE_HELGRIND: "1"
        run: |
          bash ci/tools/soak.sh \
            "$GITHUB_WORKSPACE/nginx-${NGINX_VERSION}/objs/nginx" 600 4
      - name: Notify Discord on failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_BUILDS: ${{ secrets.DISCORD_CHANNEL_BUILDS }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_BOT_TOKEN" ] || exit 0
          curl -fsS -X POST -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_BUILDS/messages" \
            -d "{\"content\":\"🔴 ${REPO} — CI Deep / helgrind FAILED. ${RUN_URL}\"}" || true

  scanners:
    name: Security scanners
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","builder02","lxc"]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Load version pins
        run: bash .github/scripts/load-versions.sh
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flawfinder clang-tidy python3 python3-pip pipx nginx-dev libhiredis-dev
          # semgrep: isolate via pipx (PEP 668 blocks a bare pip3 install into the
          # system Python on the Ubuntu 24.04 self-hosted runner). Fall back to a
          # user pip install with --break-system-packages if pipx is unavailable.
          if command -v pipx >/dev/null; then
            pipx install --quiet semgrep
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            pip3 install --quiet --user --break-system-packages semgrep
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: Configure nginx src tree (clang-tidy headers)
        run: |
          set -euo pipefail
          # Pinned and digest-verified, like every other nginx fetch in this
          # file. This one also scraped for "latest" and wget'd it unverified,
          # so the headers clang-tidy read could drift from the tree the rest
          # of CI builds against.
          bash .github/scripts/fetch-verify.sh \
            "https://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz" \
            "$NGINX_VERSION_SHA256" \
            "nginx-${NGINX_VERSION}.tar.gz"
          tar -xzf "nginx-${NGINX_VERSION}.tar.gz"; cd "nginx-${NGINX_VERSION}"
          CC=gcc ./configure --with-compat --add-dynamic-module="$GITHUB_WORKSPACE" >/dev/null
          echo "NGINX_SRC_TREE=$PWD" >> "$GITHUB_ENV"
      - name: flawfinder
        run: |
          flawfinder --minlevel=1 \
            "$GITHUB_WORKSPACE"/src/ngx_http_error_abuse_*.c 2>&1 | tee flawfinder.log
          # Gate on any high-severity (level >= 4) finding.
          if flawfinder --minlevel=4 --quiet \
               "$GITHUB_WORKSPACE"/src/ngx_http_error_abuse_*.c \
               2>/dev/null | grep -Eq 'Hits = [1-9]'; then
            echo "✗ flawfinder: high-severity (>=4) findings present" >&2
            exit 1
          fi
          echo "✓ flawfinder: clean at level >= 4"
      - name: clang-tidy (cert-*, security.*)
        run: |
          set -euo pipefail
          N="$NGINX_SRC_TREE"
          INCLUDES="-I$N/src/core -I$N/src/event -I$N/src/event/modules -I$N/src/event/quic \
            -I$N/src/os/unix -I$N/objs -I$N/src/http -I$N/src/http/modules -I$N/src/http/v2 -I/usr/include"
          # shellcheck disable=SC2086,SC2046
          clang-tidy "$GITHUB_WORKSPACE"/src/ngx_http_error_abuse_*.c \
            --checks='-*,cert-*,clang-analyzer-security.*,-clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling' \
            --warnings-as-errors='*' \
            -- $INCLUDES $(pkg-config --cflags hiredis 2>/dev/null) \
            2>&1 | tee clang-tidy.log
      - name: semgrep
        run: |
          semgrep scan --config p/c --config p/security-audit \
            "$GITHUB_WORKSPACE"/src/ngx_http_error_abuse_*.c 2>&1 | tee semgrep.log || true
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: security-reports
          path: |
            ${{ github.workspace }}/flawfinder.log
            ${{ github.workspace }}/clang-tidy.log
            ${{ github.workspace }}/semgrep.log
          retention-days: 14
