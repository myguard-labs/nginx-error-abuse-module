# sync-sha: b0723457ecc25bb7a75af2e82050c13fe9f3865aa50ed2c8e28510aed8f44acb
name: CI

# Single entry point orchestrator (cp4a). This is the ONLY workflow carrying a
# pull_request trigger; every PR-lane member is reachable at PR time solely as a
# workflow_call from here. Adding a pull_request trigger to a member would make
# it run twice and is not the convention — add the call here instead.
#
# ci-deep.yml is schedule-driven and deliberately NOT a member of this lane.
#
# Runner lanes (cp8). Measured per-called-workflow wall clock from run
# 30864509849 (2026-08-04, branch ci/cp7b-linter, self-hosted builder02):
#   fuzzing            265s (self-hosted) -- longest single job, the budget
#   valgrind            90s (self-hosted)
#   build-test          85s (self-hosted; internally Build 47s, Test::Nginx 51s,
#                             Validation 17s, Runtime 35s)
#   security-scanners   65s (self-hosted)
#   asan                62s (self-hosted; internally 59s + 62s)
#   codeql              93s (HOSTED ubuntu-latest)
#   lint                56s (HOSTED ubuntu-latest)
#
# builder02 has 6 real self-hosted ephemeral slots (docker-01, docker-02,
# runner-01..04 -- `systemctl list-units | grep ci-ephemeral`). Before this
# change, every self-hosted job started at t=0 with no `needs:` between them:
# build-test fans out to 3 concurrent jobs, asan to 2, plus valgrind,
# security-scanners and fuzzing each 1 -- 8 self-hosted jobs racing 6 slots.
# The measured run (30864509849) happened to show zero queueing delay (all
# jobs startedAt 00:06:30, run created 00:06:27), so this is oversubscription
# headroom removed, NOT a measured wall-clock speedup -- no speedup was
# measured or claimed here.
#
# Three lanes -- three that fit beats four that fit:
#   Lane A: fuzzing alone (265s), nothing chained behind it. Headroom 0s.
#   Lane B: valgrind (90s) -> security-scanners (65s) = 155s. Headroom 110s.
#   Lane C: build-test (85s) -> asan (62s) = 147s. Headroom 118s.
#   codeql and lint are HOSTED (ubuntu-latest): no `needs:`, not laned,
#   start immediately alongside everything else.
#
# After this change, peak self-hosted concurrency at t=0 is 5 (fuzzing 1 +
# valgrind 1 + build-test's 3 fanned-out jobs), under the 6-slot ceiling.
#
# Re-derive the per-job timings with:
#   gh run view <id> --json jobs -q '.jobs[] | [.name, .conclusion, (((.completedAt|fromdate)-(.startedAt|fromdate))|tostring)+"s", .startedAt, .completedAt] | @tsv'

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: orchestrator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny at the orchestrator level; every job below declares the exact
# permission its called workflow needs, so this workflow itself owns none.
permissions: {}

# secrets: inherit on the five jobs below predates this PR (cp4a) and is
# pre-existing on every member except lint (which needs no secret and does not
# use it). This repo carries no repository/environment secrets today -- inherit
# is defensive boilerplate with nothing to leak, not an active grant -- so
# narrowing it to a named `secrets:` block is a no-op until a real secret is
# added, and auditing which member will eventually need which one is a separate
# task from porting the lint gate (cp7b). Flagged here rather than silently
# ignored; narrow this the day a secret is actually introduced.
jobs:
  build-test:
    permissions:
      contents: read
    uses: ./.github/workflows/build-test.yml
    secrets: inherit # zizmor: ignore[secrets-inherit] -- no secrets configured on this repo yet, see note above jobs:

  asan:
    needs: build-test
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/asan.yml

  fuzzing:
    permissions:
      contents: read
    uses: ./.github/workflows/fuzzing.yml
    secrets: inherit # zizmor: ignore[secrets-inherit] -- no secrets configured on this repo yet, see note above jobs:

  valgrind:
    permissions:
      contents: read
    uses: ./.github/workflows/valgrind.yml
    secrets: inherit # zizmor: ignore[secrets-inherit] -- no secrets configured on this repo yet, see note above jobs:

  security-scanners:
    needs: valgrind
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/security-scanners.yml
    secrets: inherit # zizmor: ignore[secrets-inherit] -- no secrets configured on this repo yet, see note above jobs:

  codeql:
    permissions:
      contents: read
      security-events: write # required so the CodeQL upload step can publish results
    uses: ./.github/workflows/codeql.yml
    secrets: inherit # zizmor: ignore[secrets-inherit] -- no secrets configured on this repo yet, see note above jobs:

  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml
