# sync-sha: 4fabbda95a3b47a086f1feabc9ea540e34833f808569b57351767bd72106e7b6
name: CI

# Single entry point orchestrator (cp4a). This is the ONLY workflow carrying a
# pull_request trigger; every PR-lane member is reachable at PR time solely as a
# workflow_call from here. Adding a pull_request trigger to a member would make
# it run twice and is not the convention — add the call here instead.
#
# ci-deep.yml is schedule-driven and deliberately NOT a member of this lane.
#
# Lint and build-test start together. The remaining calls run in bounded
# phases; !cancelled() preserves independent diagnostics after failures.
# ci/tools/check_ci_graph.py verifies expanded leaf concurrency.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: orchestrator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny at the orchestrator level; every job below declares the exact
# permission its called workflow needs, so this workflow itself owns none.
permissions: {}

# This repo carries no repository/environment secrets: every member below is
# contents: read over a public tree, and none declares a workflow_call secret.
# ci/linter's `secrets` check enforces that no caller here uses
# `secrets: inherit` -- the day a real secret is needed, it gets a typed
# `required: true` declaration at the member and a named `secrets:` block at
# the call site, never a blanket inherit.
jobs:
  build-test:
    permissions:
      contents: read
    uses: ./.github/workflows/build-test.yml  # zizmor: ignore[self-repository] -- actionlint lacks $/ syntax

  asan:
    needs: [build-test, lint]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/asan.yml  # zizmor: ignore[self-repository] -- actionlint lacks $/ syntax

  valgrind:
    needs: build-test
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/valgrind.yml  # zizmor: ignore[self-repository] -- actionlint lacks $/ syntax

  security-scanners:
    needs: codeql
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/security-scanners.yml  # zizmor: ignore[self-repository] -- actionlint lacks $/ syntax

  codeql:
    needs: lint
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      security-events: write # required so the CodeQL upload step can publish results
    uses: ./.github/workflows/codeql.yml  # zizmor: ignore[self-repository] -- actionlint lacks $/ syntax

  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml  # zizmor: ignore[self-repository] -- actionlint lacks $/ syntax

  windows:
    needs: [build-test, lint]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/windows.yml  # zizmor: ignore[self-repository] -- actionlint lacks $/ syntax
