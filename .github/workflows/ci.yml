# sync-sha: e98ac3b66988d8619a8a1f421644c4e4aacbdb2a534fb384c72923b492979bb9
name: CI

# Single entry point orchestrator (cp4a). This is the ONLY workflow carrying a
# pull_request trigger; every PR-lane member is reachable at PR time solely as a
# workflow_call from here. Adding a pull_request trigger to a member would make
# it run twice and is not the convention — add the call here instead.
#
# ci-deep.yml is schedule-driven and deliberately NOT a member of this lane.
#
# Runner lanes. Measured per-called-workflow wall clock from run 32162940330
# (2026-08-18, PR #54, self-hosted builder02):
#   fuzzing            307s -- longest single job, the budget
#   codeql             179s
#   asan               154s -- slower of its two parallel jobs
#   build-test         136s -- first child start through Runtime completion
#   valgrind           132s
#   security-scanners   93s
#   lint                14s
#
# Every member reads the POOL repository variable. On builder02 that selects 6
# ephemeral slots (docker-01, docker-02, runner-01..04; count with
# `systemctl list-units | grep ci-ephemeral`). Four lanes start six pool jobs:
# fuzzing, CodeQL, Valgrind, and build-test's three-way fan-out.
#
# Four lanes are the minimum: 1015s total does not fit three 307s lanes.
#   Lane A: fuzzing alone (307s), nothing chained behind it. Headroom 0s.
#   Lane B: build-test (136s) -> asan (154s) = 290s. Headroom 17s.
#   Lane C: codeql (179s) -> security-scanners (93s) = 272s.
#           Headroom 35s.
#   Lane D: valgrind (132s) -> lint (14s) = 146s. Headroom 161s.
#
# Re-derive the per-job timings with:
#   gh run view 32162940330 -R myguard-labs/nginx-error-abuse-module \
#     --json jobs -q '.jobs[] | [.name, .conclusion,
#     (((.completedAt|fromdate)-(.startedAt|fromdate))|tostring)+"s",
#     .startedAt, .completedAt] | @tsv'

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: orchestrator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny at the orchestrator level; every job below declares the exact
# permission its called workflow needs, so this workflow itself owns none.
permissions: {}

# This repo carries no repository/environment secrets: every member below is
# contents: read over a public tree, and none declares a workflow_call secret.
# ci/linter's `secrets` check enforces that no caller here uses
# `secrets: inherit` -- the day a real secret is needed, it gets a typed
# `required: true` declaration at the member and a named `secrets:` block at
# the call site, never a blanket inherit.
jobs:
  build-test:
    permissions:
      contents: read
    uses: ./.github/workflows/build-test.yml

  asan:
    needs: build-test
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/asan.yml

  fuzzing:
    permissions:
      contents: read
    uses: ./.github/workflows/fuzzing.yml

  valgrind:
    permissions:
      contents: read
    uses: ./.github/workflows/valgrind.yml

  security-scanners:
    needs: codeql
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/security-scanners.yml

  codeql:
    permissions:
      contents: read
      security-events: write # required so the CodeQL upload step can publish results
    uses: ./.github/workflows/codeql.yml

  lint:
    needs: valgrind
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml
