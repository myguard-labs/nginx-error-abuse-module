name: CodeQL

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NGINX_VERSION: "1.31.1"

on:
  push:
    branches: [main]
  schedule:
    # Monthly, day 4 @ 04:47 UTC (staggered per repo like ci-deep).
    - cron: "47 4 4 * *"
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl libhiredis-dev libpcre2-dev zlib1g-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: c-cpp
          queries: security-extended
          config: |
            paths:
              - src/ngx_http_error_abuse_module.c
              - src/ngx_http_error_abuse_scan.c
            paths-ignore:
              - .build/**

      # cp7a: mode=module here is configure-only (no core `make`), so most of
      # the win is the source tarball and configure-skip stamp -- but ccache
      # still helps the module's own two TUs, and reusing the action keeps
      # this workflow from hand-duplicating the tarball cache key logic.
      - name: Restore build caches
        uses: ./.github/actions/build-cache
        with:
          mode: module
          nginx-version: ${{ env.NGINX_VERSION }}

      - name: Build traced source
        run: bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" module

      - name: Analyze
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: /language:c-cpp
