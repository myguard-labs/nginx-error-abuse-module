# sync-sha: 6894ea20c5bace7a5ea2c3475633cd85750afbba7f8aec71d2c5b191291bf472
name: CodeQL

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # NGINX_VERSION is deliberately NOT set here. It comes from
  # .github/versions.env via the "Load version pins" step in each job below.
  # A workflow-level env of the same name would WIN over the $GITHUB_ENV write
  # that step makes, silently pinning the build to this literal while the file
  # that claims to be the single source of truth was ignored.

on:
  push:
    branches: [main]
  schedule:
    # Monthly, day 4 @ 04:47 UTC (staggered per repo like ci-deep).
    - cron: "47 4 4 * *"
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # required so the CodeQL upload step can publish results
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl libhiredis-dev libpcre2-dev zlib1g-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: c-cpp
          queries: security-extended
          config: |
            paths:
              - src/ngx_http_error_abuse_module.c
              - src/ngx_http_error_abuse_scan.c
            paths-ignore:
              - .build/**

      # cp8: NO cache restore here, and NO_CACHE=1 on the build below. CodeQL
      # traces the compiler invocations that happen during "Build traced
      # source" -- if ccache (or a restored build tree) serves the module's
      # two TUs instead of a real compiler running under the tracer, the
      # resulting database has no C/C++ code in it and `codeql analyze` fails
      # with "CodeQL could not process any code written in C/C++" (seen on
      # run 30865052783, exit 32 at `database finalize`, with a WARM ccache).
      # A cold cache happened to hide this at cp7b, which is why it shipped.
      # The source tarball / configure-skip stamp would be safe to keep (they
      # don't touch the compiler), but ci-build.sh's NO_CACHE=1 clears all of
      # ccache, the build tree AND the tarball together -- there's no cheap
      # way to keep just the tarball without hand-duplicating cache-key logic
      # here, so the whole restore is dropped instead. Losing the tarball
      # download is a few seconds; a silently-empty CodeQL database is not
      # something to trade it for.
      - name: Build traced source
        env:
          NO_CACHE: "1"
        run: bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" module

      - name: Analyze
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: /language:c-cpp
