# sync-sha: 9850088084a9abc9ad0b40be71086b13689ca5862349268ec3ef66e7be6a87f4
name: A/UBSan

# ASan/UBSan request-storm soak on every PR/push, extracted from build-test.yml
# (cp6) so the badge/table slot PROMPT.md §"6 — ASan and fuzzing, retargeted"
# reserved has a real workflow behind it. Static --add-module build (never
# dynamic -- interception loss under ASan), single-process and multi-worker
# lanes both exercise the module's real directives and body path via
# ci/tools/test_runtime.py -- see that script's vars.log assertions
# (PASSED/COUNTED/BLOCKED via $error_abuse_status) for the reach-verification
# evidence this soak actually drives the handler, not a default GET.
#
# Action pins (keep in sync with build-test.yml header):
# actions/checkout@v7.0.1        -> 3d3c42e5aac5ba805825da76410c181273ba90b1

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # NGINX_VERSION is deliberately NOT set here. It comes from
  # .github/versions.env via the "Load version pins" step in each job below.
  # A workflow-level env of the same name would WIN over the $GITHUB_ENV write
  # that step makes, silently pinning the build to this literal while the file
  # that claims to be the single source of truth was ignored.

on:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: asan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  asan:
    name: ASan and UBSan
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.asan-artifact.outputs.artifact-id }}
      build-identity: ${{ steps.asan-identity.outputs.identity }}
      binary-sha256: ${{ steps.asan-identity.outputs.sha256 }}
      artifact-identity: ${{ steps.asan-identity.outputs.artifact-identity }}
      artifact-sha256: ${{ steps.asan-identity.outputs.artifact-sha256 }}
    env:
      # Own band, disjoint from build-test.yml:runtime and this file's
      # asan-reload job -- all three can land on the same self-hosted runner
      # with no concurrency group serialising them (lint-ci-ports.sh gates on
      # this; see build-test.yml:runtime for the sibling band).
      #
      # WIDTH MUST BE DECLARED. max-port.sh defaults to 64, but the bands are
      # only 32 apart, so the default made this job "verify" 18912-18975 --
      # straight across asan-reload's 18944. The check then fails on a
      # sibling's healthy listener instead of on a real collision.
      TEST_BASE_PORT: "18912"
      TEST_PORT_WIDTH: "32"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The prober engine lives in ci/t/harness (nginx-module-testkit).
          # Without this the prober steps below fail fast with "ci/t/harness
          # is empty" instead of silently skipping -- see run.sh's own gate.
          submodules: true

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl libhiredis-dev libpcre2-dev redis-server \
            zlib1g-dev

      # Compiler objects are isolated from PR runs; source archives are verified.
      - name: Restore build caches
        id: build-cache
        uses: ./.github/actions/build-cache  # zizmor: ignore[self-repository] -- actionlint lacks $/ syntax
        with:
          mode: asan
          nginx-version: ${{ env.NGINX_VERSION }}

      - name: Build with sanitizers
        env:
          CI_BUILD_CACHE_HIT: ${{ steps.build-cache.outputs.exact-hit }}
          CI_BUILD_CACHE_IDENTITY: ${{ steps.build-cache.outputs.identity }}
        run: bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" asan

      - name: Identify plain ASan artifact
        id: asan-identity
        run: bash ci/tools/ci-build-artifact.sh export "$NGINX_VERSION" .build/asan-artifact

      - name: Upload plain ASan artifact
        id: asan-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asan-plain-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/asan-artifact/nginx
          if-no-files-found: error
          # Reruns are available for 30 days; keep the artifact past that boundary.
          retention-days: 31

      - name: Sweep stale test listeners
        run: |
          # Kill leftovers from earlier crashed runs still holding THIS job's
          # ports (cross-repo collisions on shared runners).
          #
          # Scoped to this job's own band, not the whole 18870-18999 range.
          # The wide sweep was PID-blind TERM: a sibling job mid-run in the
          # range lost its listeners to another job's cleanup, which surfaces
          # as a connection-refused flake in a job that did nothing wrong.
          # Disjoint bands (build-test 18880, asan 18912, asan-reload 18944)
          # only prevent two jobs from BINDING the same port; they do nothing
          # about one job killing across all of them.
          command -v fuser >/dev/null || sudo apt-get install -y psmisc
          for p in $(seq "$TEST_BASE_PORT" $((TEST_BASE_PORT + TEST_PORT_WIDTH - 1))); do
            fuser -k -TERM "${p}/tcp" 2>/dev/null || true
          done
          sleep 1

      - name: Verify test port band is free
        run: bash ci/tools/max-port.sh "$TEST_BASE_PORT"

      - name: Run runtime suite under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          python3 ci/tools/test_runtime.py \
            --port "$TEST_BASE_PORT" \
            --single-process \
            --redis-server /usr/bin/redis-server \
            --nginx-binary "$GITHUB_WORKSPACE/.build/nginx-${NGINX_VERSION}-asan/objs/nginx"

      # The prober's own fault-injected paths (slab exhaustion) under ASan and
      # UBSan too, not just the runtime suite above. Own tree: TEST_HARNESS=1
      # lands in a "-harness" suffixed tree (see ci-build.sh) distinct from
      # the plain asan tree the step above built and cached.
      - name: Build with sanitizers and the probe harness enabled
        run: TEST_HARNESS=1 bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" asan

      - name: Build the prober
        run: bash ci/t/harness/ci/prober/build.sh

      # Own band -- disjoint from every TEST_BASE_PORT band declared across
      # every workflow (18880/18912/18944/18976/19008, width 32 each) and
      # from build-test.yml's runtime (19040) and coverage (19072) prober
      # bands, so all four prober-running jobs can run concurrently.
      - name: Verify prober port band is free
        run: bash ci/tools/max-port.sh 19104 32

      # Two SEPARATE runs, not one -- see build-test.yml:runtime's identical
      # comment; on_full is a ZONE parameter and the prober arms/reads state
      # through one probe URI per run.
      - name: Run prober rules under ASan and UBSan (allow)
        env:
          PROBER_SCENARIO: allow
          PROBER_BUILD: ${{ github.workspace }}/.build/nginx-${{ env.NGINX_VERSION }}-asan-harness
          PROBER_PORT: "19104"
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: bash ci/t/prober/run.sh nginx "$NGINX_VERSION"

      - name: Run prober rules under ASan and UBSan (reject)
        env:
          PROBER_SCENARIO: reject
          PROBER_BUILD: ${{ github.workspace }}/.build/nginx-${{ env.NGINX_VERSION }}-asan-harness
          PROBER_PORT: "19104"
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: bash ci/t/prober/run.sh nginx "$NGINX_VERSION"

  asan-reload:
    needs: asan
    # Keep reload diagnostics after a post-upload failure, but stop on cancellation.
    if: ${{ !cancelled() && needs.asan.outputs.artifact-id != '' }}
    name: ASan multi-worker + reload
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    env:
      # Own band -- see the asan job above and build-test.yml:runtime for the
      # sibling bands this must stay disjoint from. Width declared for the
      # reason spelled out on the asan job's band above.
      TEST_BASE_PORT: "18944"
      TEST_PORT_WIDTH: "32"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl libhiredis-dev libpcre2-dev redis-server \
            zlib1g-dev ccache mold eatmydata

      # Current-run ID from the producer, not a name-only/cross-run lookup.
      - name: Download plain ASan artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.asan.outputs.artifact-id }}
          path: .build/asan-download
          merge-multiple: true

      - name: Verify plain ASan artifact
        env:
          EXPECTED_BUILD_IDENTITY: ${{ needs.asan.outputs.build-identity }}
          EXPECTED_BINARY_SHA256: ${{ needs.asan.outputs.binary-sha256 }}
          EXPECTED_ARTIFACT_IDENTITY: ${{ needs.asan.outputs.artifact-identity }}
          EXPECTED_ARTIFACT_SHA256: ${{ needs.asan.outputs.artifact-sha256 }}
        run: bash ci/tools/ci-build-artifact.sh import "$NGINX_VERSION" .build/asan-download

      # CI-3: exercise the master + multi-worker lifecycle (reload overlap,
      # worker shutdown, helper-process init) under ASan/UBSan — the paths the
      # single-process job cannot reach. Leak detection stays off because
      # nginx's own arena is not freed at fast shutdown.
      - name: Sweep stale test listeners
        run: |
          # Kill leftovers from earlier crashed runs still holding THIS job's
          # ports (cross-repo collisions on shared runners).
          #
          # Scoped to this job's own band, not the whole 18870-18999 range.
          # The wide sweep was PID-blind TERM: a sibling job mid-run in the
          # range lost its listeners to another job's cleanup, which surfaces
          # as a connection-refused flake in a job that did nothing wrong.
          # Disjoint bands (build-test 18880, asan 18912, asan-reload 18944)
          # only prevent two jobs from BINDING the same port; they do nothing
          # about one job killing across all of them.
          command -v fuser >/dev/null || sudo apt-get install -y psmisc
          for p in $(seq "$TEST_BASE_PORT" $((TEST_BASE_PORT + TEST_PORT_WIDTH - 1))); do
            fuser -k -TERM "${p}/tcp" 2>/dev/null || true
          done
          sleep 1

      - name: Verify test port band is free
        run: bash ci/tools/max-port.sh "$TEST_BASE_PORT"

      - name: Run multi-worker suite under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          python3 ci/tools/test_runtime.py \
            --port "$TEST_BASE_PORT" \
            --redis-server /usr/bin/redis-server \
            --nginx-binary "$GITHUB_WORKSPACE/.build/nginx-${NGINX_VERSION}-asan/objs/nginx"
