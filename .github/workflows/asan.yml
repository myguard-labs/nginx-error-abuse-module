name: A/UBSan

# ASan/UBSan request-storm soak on every PR/push, extracted from build-test.yml
# (cp6) so the badge/table slot PROMPT.md §"6 — ASan and fuzzing, retargeted"
# reserved has a real workflow behind it. Static --add-module build (never
# dynamic -- interception loss under ASan), single-process and multi-worker
# lanes both exercise the module's real directives and body path via
# ci/tools/test_runtime.py -- see that script's vars.log assertions
# (PASSED/COUNTED/BLOCKED via $error_abuse_status) for the reach-verification
# evidence this soak actually drives the handler, not a default GET.
#
# Action pins (keep in sync with build-test.yml header):
# actions/checkout@v5        -> 93cb6efe18208431cddfb8368fd83d5badbf9bfd

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NGINX_VERSION: "1.31.1"

on:
  push:
    branches: [master, main, dev]
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: asan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  asan:
    name: ASan and UBSan
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","builder02","lxc"]') }}
    timeout-minutes: 30
    env:
      # Own band, disjoint from build-test.yml:runtime and this file's
      # asan-reload job -- all three can land on the same self-hosted runner
      # with no concurrency group serialising them (lint-ci-ports.sh gates on
      # this; see build-test.yml:runtime for the sibling band).
      TEST_BASE_PORT: "18912"
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl libhiredis-dev libpcre2-dev redis-server \
            zlib1g-dev

      # cp7a: mold and eatmydata are both SKIPPED under this mode by
      # ci-build.sh itself (sanitizer runtime ordering / linker
      # requirements) -- the action still restores ccache, the source
      # tarball and the (asan-only, exact-match) build tree.
      - name: Restore build caches
        uses: ./.github/actions/build-cache
        with:
          mode: asan
          nginx-version: ${{ env.NGINX_VERSION }}

      - name: Build with sanitizers
        run: bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" asan

      - name: Sweep stale test listeners
        run: |
          # Kill leftovers from earlier crashed runs still holding test
          # ports (cross-repo collisions on shared runners).
          command -v fuser >/dev/null || sudo apt-get install -y psmisc
          for p in $(seq 18870 18999); do
            fuser -k -TERM "${p}/tcp" 2>/dev/null || true
          done
          sleep 1

      - name: Verify test port band is free
        run: bash ci/tools/max-port.sh "$TEST_BASE_PORT"

      - name: Run runtime suite under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          python3 ci/tools/test_runtime.py \
            --port "$TEST_BASE_PORT" \
            --single-process \
            --redis-server /usr/bin/redis-server \
            --nginx-binary "$GITHUB_WORKSPACE/.build/nginx-${NGINX_VERSION}-asan/objs/nginx"

  asan-reload:
    name: ASan multi-worker + reload
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","builder02","lxc"]') }}
    timeout-minutes: 30
    env:
      # Own band -- see the asan job above and build-test.yml:runtime for the
      # sibling bands this must stay disjoint from.
      TEST_BASE_PORT: "18944"
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl libhiredis-dev libpcre2-dev redis-server \
            zlib1g-dev

      # cp7a: mold and eatmydata are both SKIPPED under this mode by
      # ci-build.sh itself (sanitizer runtime ordering / linker
      # requirements) -- the action still restores ccache, the source
      # tarball and the (asan-only, exact-match) build tree.
      - name: Restore build caches
        uses: ./.github/actions/build-cache
        with:
          mode: asan
          nginx-version: ${{ env.NGINX_VERSION }}

      - name: Build with sanitizers
        run: bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" asan

      # CI-3: exercise the master + multi-worker lifecycle (reload overlap,
      # worker shutdown, helper-process init) under ASan/UBSan — the paths the
      # single-process job cannot reach. Leak detection stays off because
      # nginx's own arena is not freed at fast shutdown.
      - name: Sweep stale test listeners
        run: |
          # Kill leftovers from earlier crashed runs still holding test
          # ports (cross-repo collisions on shared runners).
          command -v fuser >/dev/null || sudo apt-get install -y psmisc
          for p in $(seq 18870 18999); do
            fuser -k -TERM "${p}/tcp" 2>/dev/null || true
          done
          sleep 1

      - name: Verify test port band is free
        run: bash ci/tools/max-port.sh "$TEST_BASE_PORT"

      - name: Run multi-worker suite under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          python3 ci/tools/test_runtime.py \
            --port "$TEST_BASE_PORT" \
            --redis-server /usr/bin/redis-server \
            --nginx-binary "$GITHUB_WORKSPACE/.build/nginx-${NGINX_VERSION}-asan/objs/nginx"
