# sync-sha: b37fa5b67fa9d81a6342f24a0e87e1f6ec970f23d465c76fcc9f62ce2d18078d
name: Fuzzing

# Fast fuzz regression gate on every PR/push — 120s/target on the status-list
# + snapshot validators, kept short so PR feedback stays quick. Long discovery
# fuzz (hours/target) lives in ci-deep.yml (monthly cron + workflow_dispatch).
#
# Action pins (keep in sync with build-test.yml header):
# actions/checkout@v7.0.1        -> 3d3c42e5aac5ba805825da76410c181273ba90b1
# actions/upload-artifact@v7.0.1 -> 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # NGINX_VERSION is deliberately NOT set here. It comes from
  # .github/versions.env via the "Load version pins" step in each job below.
  # A workflow-level env of the same name would WIN over the $GITHUB_ENV write
  # that step makes, silently pinning the build to this literal while the file
  # that claims to be the single source of truth was ignored.

on:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: fuzzing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz-regression:
    name: Fuzz regression (120s/target)
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout module
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install clang + libFuzzer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang build-essential curl libhiredis-dev libpcre2-dev zlib1g-dev

      # cp7a: mostly the tarball + configure-skip stamp for mode=module.
      - name: Restore build caches
        uses: ./.github/actions/build-cache
        with:
          mode: module
          nginx-version: ${{ env.NGINX_VERSION }}

      # The fuzz targets link the module's real scan TU and nginx's real
      # src/core/ngx_string.c, so they need a CONFIGURED nginx tree for
      # objs/ngx_auto_config.h. Configure-only (mode=module) is enough --
      # ci/fuzz/build.sh compiles the sources it needs itself.
      - name: Configure nginx tree
        run: bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" module

      - name: Build fuzz targets
        run: bash ci/fuzz/build.sh "$GITHUB_WORKSPACE/ci/fuzz"

      # Replay every recorded past-crash shape before the fresh time-boxed
      # run. libFuzzer treats a file argument (not a corpus dir) as a
      # one-shot replay, so a returning crash aborts here in seconds instead
      # of waiting on the 120s fresh budget below.
      #
      # Each fixture is dispatched to its target based on the filename prefix:
      # snapshot-*.bin runs through fuzz_snapshot, statuses-*.bin through
      # fuzz_statuses. A fixture with no recognized prefix causes the step
      # to exit non-zero and fail the gate (no silent skip).
      - name: Replay regression corpus
        run: |
          set -euo pipefail
          cd ci/fuzz
          shopt -s nullglob
          files=(regressions/*.bin)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no regression fixtures under ci/fuzz/regressions/"
            exit 0
          fi
          fail=0
          for f in "${files[@]}"; do
            filename=$(basename "$f")
            bin=""
            if [[ "$filename" == snapshot-* ]]; then
              bin="./fuzz_snapshot"
            elif [[ "$filename" == statuses-* ]]; then
              bin="./fuzz_statuses"
            else
              echo "❌ fixture has no recognized prefix (snapshot-* or statuses-*): $f"
              fail=1
              continue
            fi
            echo "=== replay $f ==="
            if ! "$bin" "$f"; then
              echo "❌ regression returned: $f"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "✓ ${#files[@]} regression(s) replayed clean"

      - name: Run each target 120s
        run: |
          set -euo pipefail
          cd ci/fuzz
          # target:corpus[:dict] — snapshot is binary (no dict); statuses is a
          # token grammar (HTTP status codes / range punctuation) so it gets one.
          targets="fuzz_snapshot:corpus: fuzz_statuses:corpus_statuses:fuzz.dict"
          for t in $targets; do
            bin="${t%%:*}"; rest="${t#*:}"; corp="${rest%%:*}"; dict="${rest#*:}"
            args=(-max_total_time=120 -print_final_stats=1 -artifact_prefix="crash-${bin}-")
            [ -n "$dict" ] && args+=("-dict=$dict")
            echo "=== $bin over $corp (120s)${dict:+ +dict} ==="
            set +e
            "./$bin" "${args[@]}" "$corp/"
            rc=$?
            set -e
            [ $rc -eq 0 ] || { echo "❌ $bin crash (exit $rc)"; exit 1; }
            echo "✓ $bin: no crashes in 120s"
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-fast-crashes
          path: ${{ github.workspace }}/ci/fuzz/crash-*
          retention-days: 14
