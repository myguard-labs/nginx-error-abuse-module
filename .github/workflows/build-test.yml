# sync-sha: cbdfab4ea94f4d0fe7c2a73ab7a00e4e431955aed8151bbcbd802972a2f4faaf
name: Build and Test

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # NGINX_VERSION is deliberately NOT set here. It comes from
  # .github/versions.env via the "Load version pins" step in each job below.
  # A workflow-level env of the same name would WIN over the $GITHUB_ENV write
  # that step makes, silently pinning the build to this literal while the file
  # that claims to be the single source of truth was ignored.

on:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    name: Validation
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck libhiredis-dev shellcheck

      - name: Validate scripts and source
        run: |
          bash -n ci/tools/ci-build.sh
          bash -n ci/tools/test-ci-build-source.sh
          shellcheck ci/tools/ci-build.sh ci/tools/test-ci-build-source.sh
          bash ci/tools/test-ci-build-source.sh
          # The runtime driver's path is assembled from two variables rather
          # than written as one contiguous string anywhere in this step
          # (command text OR comments): ANY appearance of that path substring
          # in the step's `run:` text makes ci/linter/lint-ci-ports.sh read this
          # job as "starts the driver" (workflow_policy.py's RUNTIME_DRIVER
          # check is a substring match over the whole step by design, so a job
          # can invoke the driver through a wrapper and still be caught). This
          # job only compiles the module and never binds a port.
          runtime_dir="ci/tools" runtime_file="test_runtime.py"
          python3 -c 'import py_compile, sys; py_compile.compile(sys.argv[1], doraise=True)' \
            "${runtime_dir}/${runtime_file}"
          cppcheck \
            --enable=warning,performance,portability \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=normalCheckLevelMaxBranches \
            --suppress=unusedFunction \
            src/ngx_http_error_abuse_module.c \
            src/ngx_http_error_abuse_scan.c
          git diff --check

      - name: Lint workflows
        run: |
          version=1.7.7
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          tarball="actionlint_${version}_linux_amd64.tar.gz"
          # CI-8: use the same trusted digest as the local installer; a checksum
          # file fetched from the asset's release origin is not independent.
          . ci/linter/actionlint-archive.sh
          curl -fsSL -o /tmp/actionlint.tgz "${base}/${tarball}"
          verify_actionlint_archive /tmp/actionlint.tgz
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color .github/workflows/*.yml

  build:
    # NOTE: this name is a REQUIRED STATUS CHECK on main. Changing it strands
    # the protection rule -- the old context never reports again and the merge
    # blocks while CI is green. Retarget the rule in the same change if it ever
    # has to move; do not merge with --admin.
    name: Build (${{ matrix.flavor }} / ${{ matrix.cc }})
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    # Latest nginx mainline only, amd64, gcc. The version is NOT a matrix
    # value: it is resolved from .github/versions.env at run time, because a
    # literal here and $NGINX_VERSION in the artifact step below were two
    # independent copies of the same number, and only one of them moved when
    # the pin was bumped.
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: nginx
            cc: gcc
            primary: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang curl libhiredis-dev libpcre2-dev zlib1g-dev

      # cp7a: ccache/mold/eatmydata presence + the source tarball, ccache and
      # build-tree caches for THIS mode (debug). See ci/tools/ci-build.sh's
      # CACHING block and the action itself for why the build-tree layer is
      # exact-match only.
      - name: Restore build caches
        uses: ./.github/actions/build-cache
        with:
          mode: debug
          flavor: ${{ matrix.flavor }}
          nginx-version: ${{ env.NGINX_VERSION }}

      - name: Build server and dynamic module
        env:
          CC: ${{ matrix.cc }}
          # Passed through env, not interpolated directly with ${{ }}: that
          # expands BEFORE the shell runs, so zizmor reads it as template
          # injection even though matrix values here are hardcoded in this
          # workflow's own strategy.matrix, never attacker input. env: goes
          # through the shell as an ordinary variable instead.
          MATRIX_FLAVOR: ${{ matrix.flavor }}
        run: |
          bash ci/tools/ci-build.sh "$MATRIX_FLAVOR" "$NGINX_VERSION"
          build=".build/${MATRIX_FLAVOR}-${NGINX_VERSION}-debug/objs"
          test -f "$build/ngx_http_error_abuse_module.so"
          ls "$build"/*nginx "$build"/*angie 2>/dev/null || true

      - name: Strict module compile
        env:
          MATRIX_FLAVOR: ${{ matrix.flavor }}
          MATRIX_CC: ${{ matrix.cc }}
        run: |
          build=".build/${MATRIX_FLAVOR}-${NGINX_VERSION}-debug"
          cflags=$(awk '/^CFLAGS[[:space:]]*=/{sub(/^CFLAGS[[:space:]]*=[[:space:]]*/,""); print; exit}' "$build/objs/Makefile")
          incs=$(awk '/^ALL_INCS[[:space:]]*=/{found=1} found{line=$0; sub(/^ALL_INCS[[:space:]]*=[[:space:]]*/,"",line); continued=(line ~ /\\$/); gsub(/\\$/, "", line); printf "%s ", line; if (!continued) exit}' "$build/objs/Makefile")
          # cflags and incs are compiler flag lists and must word-split.
          # Both TUs get the strict pass. The scan TU holds the two parsers that
          # walk untrusted bytes, so exempting it from -Werror would leave the
          # highest-risk file in the module as the only one not strictly built.
          # shellcheck disable=SC2086
          (
            cd "$build"
            for tu in ngx_http_error_abuse_module ngx_http_error_abuse_scan; do
              "$MATRIX_CC" -c -fPIC $cflags \
                -Wall -Wextra -Wshadow -Wstrict-prototypes \
                -Wstrict-aliasing -Wunreachable-code -Werror \
                -Wno-unused-parameter \
                $incs "$GITHUB_WORKSPACE/src/${tu}.c" \
                -o "/tmp/${tu}.o"
            done
          )

      - name: Build deterministic fault-control modules
        run: |
          bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" fault-list-push
          bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" fault-retry-buffer
          bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" fault-persist-short-read
          bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" fault-persist-short-write
          bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" fault-persist-fsync
          bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" fault-redis-backoff
          bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" fault-redis-state

      - name: Stage artifact
        if: matrix.primary
        run: |
          mkdir artifact
          cp ".build/nginx-${NGINX_VERSION}-debug/objs/nginx" artifact/
          cp ".build/nginx-${NGINX_VERSION}-debug/objs/ngx_http_error_abuse_module.so" artifact/
          cp ".build/nginx-${NGINX_VERSION}-fault-list-push/objs/ngx_http_error_abuse_module.so" \
            artifact/ngx_http_error_abuse_fault_list_push_module.so
          cp ".build/nginx-${NGINX_VERSION}-fault-retry-buffer/objs/ngx_http_error_abuse_module.so" \
            artifact/ngx_http_error_abuse_fault_retry_buffer_module.so
          cp ".build/nginx-${NGINX_VERSION}-fault-persist-short-read/objs/ngx_http_error_abuse_module.so" \
            artifact/ngx_http_error_abuse_fault_persist_short_read_module.so
          cp ".build/nginx-${NGINX_VERSION}-fault-persist-short-write/objs/ngx_http_error_abuse_module.so" \
            artifact/ngx_http_error_abuse_fault_persist_short_write_module.so
          cp ".build/nginx-${NGINX_VERSION}-fault-persist-fsync/objs/ngx_http_error_abuse_module.so" \
            artifact/ngx_http_error_abuse_fault_persist_fsync_module.so
          cp ".build/nginx-${NGINX_VERSION}-fault-redis-backoff/objs/ngx_http_error_abuse_module.so" \
            artifact/ngx_http_error_abuse_fault_redis_backoff_module.so
          cp ".build/nginx-${NGINX_VERSION}-fault-redis-state/objs/ngx_http_error_abuse_module.so" \
            artifact/ngx_http_error_abuse_fault_redis_state_module.so

      - name: Upload nginx artifact
        if: matrix.primary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nginx-mainline
          path: artifact/
          retention-days: 1

  runtime:
    name: Runtime
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    needs: build
    env:
      # Own band, disjoint from asan.yml's asan/asan-reload jobs -- all three
      # can land on the same self-hosted runner with no concurrency group
      # serialising them (ci/linter/lint-ci-ports.sh gates on this).
      # Width declared because max-port.sh defaults to 64 and the bands sit 32
      # apart -- see the asan job's band for the full reasoning.
      TEST_BASE_PORT: "18880"
      TEST_PORT_WIDTH: "32"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download nginx artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nginx-mainline
          path: nginx-bin

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhiredis-dev redis-server

      - name: Sweep stale test listeners
        run: |
          # Kill leftovers from earlier crashed runs still holding THIS job's
          # ports (cross-repo collisions on shared runners).
          #
          # Scoped to this job's own band, not the whole 18870-18999 range.
          # The wide sweep was PID-blind TERM: a sibling job mid-run in the
          # range lost its listeners to another job's cleanup, which surfaces
          # as a connection-refused flake in a job that did nothing wrong.
          # Disjoint bands (build-test 18880, asan 18912, asan-reload 18944)
          # only prevent two jobs from BINDING the same port; they do nothing
          # about one job killing across all of them.
          command -v fuser >/dev/null || sudo apt-get install -y psmisc
          for p in $(seq "$TEST_BASE_PORT" $((TEST_BASE_PORT + TEST_PORT_WIDTH - 1))); do
            fuser -k -TERM "${p}/tcp" 2>/dev/null || true
          done
          sleep 1

      - name: Verify test port band is free
        run: bash ci/tools/max-port.sh "$TEST_BASE_PORT"

      - name: Run multi-worker runtime suite
        run: |
          chmod +x nginx-bin/nginx
          python3 ci/tools/test_runtime.py \
            --port "$TEST_BASE_PORT" \
            --nginx-binary "$GITHUB_WORKSPACE/nginx-bin/nginx" \
            --module "$GITHUB_WORKSPACE/nginx-bin/ngx_http_error_abuse_module.so" \
            --redis-server /usr/bin/redis-server

      - name: Run rejection-header allocation fault controls
        run: |
          python3 ci/tools/test_runtime.py \
            --port "$((TEST_BASE_PORT + 28))" \
            --nginx-binary "$GITHUB_WORKSPACE/nginx-bin/nginx" \
            --module "$GITHUB_WORKSPACE/nginx-bin/ngx_http_error_abuse_fault_list_push_module.so" \
            --reject-header-fault cache-control
          python3 ci/tools/test_runtime.py \
            --port "$((TEST_BASE_PORT + 29))" \
            --nginx-binary "$GITHUB_WORKSPACE/nginx-bin/nginx" \
            --module "$GITHUB_WORKSPACE/nginx-bin/ngx_http_error_abuse_fault_retry_buffer_module.so" \
            --reject-header-fault retry-after

      - name: Run persistence I/O and Redis state controls
        run: |
          for fault in short-read short-write fsync; do
            module_name="${fault//-/_}"
            python3 ci/tools/test_runtime.py \
              --port "$((TEST_BASE_PORT + 24))" \
              --nginx-binary "$GITHUB_WORKSPACE/nginx-bin/nginx" \
              --module "$GITHUB_WORKSPACE/nginx-bin/ngx_http_error_abuse_module.so" \
              --fault-module "$GITHUB_WORKSPACE/nginx-bin/ngx_http_error_abuse_fault_persist_${module_name}_module.so" \
              --persistence-io-fault "$fault"
          done
          python3 ci/tools/test_runtime.py \
            --port "$((TEST_BASE_PORT + 25))" \
            --nginx-binary "$GITHUB_WORKSPACE/nginx-bin/nginx" \
            --fault-module "$GITHUB_WORKSPACE/nginx-bin/ngx_http_error_abuse_fault_redis_backoff_module.so" \
            --redis-backoff-cap
          python3 ci/tools/test_runtime.py \
            --port "$((TEST_BASE_PORT + 26))" \
            --nginx-binary "$GITHUB_WORKSPACE/nginx-bin/nginx" \
            --module "$GITHUB_WORKSPACE/nginx-bin/ngx_http_error_abuse_fault_redis_state_module.so" \
            --redis-server /usr/bin/redis-server \
            --redis-state-controls

  coverage:
    name: Coverage report
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    env:
      # The runtime driver uses this base plus offsets through +20. Keep its
      # 32-port band disjoint from runtime (18880), ASan (18912/18944), and
      # Test::Nginx (18976), which may share a persistent runner.
      TEST_BASE_PORT: "19008"
      TEST_PORT_WIDTH: "32"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install coverage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cpanminus gcovr libhiredis-dev libio-socket-ssl-perl \
            libpcre2-dev redis-server zlib1g-dev
          # libtest-nginx-perl is unavailable on ubuntu-24.04 runners.
          sudo cpanm --notest --quiet Test::Nginx

      - name: Restore coverage build cache
        uses: ./.github/actions/build-cache
        with:
          mode: coverage
          nginx-version: ${{ env.NGINX_VERSION }}

      - name: Verify coverage port band is free
        run: bash ci/tools/max-port.sh "$TEST_BASE_PORT" "$TEST_PORT_WIDTH"

      - name: Generate coverage report
        # No COVERAGE_FAIL_UNDER: this job publishes measured coverage, not a
        # gamed percentage gate. Build and runtime failures still fail it.
        run: ci/tools/coverage.sh "$NGINX_VERSION"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: .build/coverage/
          retention-days: 14

  test-nginx:
    name: Test::Nginx
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    env:
      # `prove` binds too. Test::Nginx::Util binds TEST_NGINX_PORT, default
      # 1984, and nothing arbitrates it -- so without a band of its own this
      # job took 1984 on a pool where six ci-ephemeral slots share one network.
      # Two concurrent runs then die with
      #   bind() to 127.0.0.1:1984 failed (98: Address already in use)
      # which reads as a module regression and is not one. Band picked to be
      # disjoint from the three already claimed: 18880 (Runtime, width 32),
      # 18912 and 18944 (asan.yml, width 32 each).
      TEST_BASE_PORT: "18976"
      # Declared because max-port.sh defaults to 64 and the bands sit 32 apart;
      # a 64-wide check here would report a false clash with the next band.
      TEST_PORT_WIDTH: "32"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl libhiredis-dev libpcre2-dev zlib1g-dev \
            cpanminus libio-socket-ssl-perl
          # libtest-nginx-perl is not packaged on ubuntu-24.04 runners; install
          # Test::Nginx from CPAN instead (cpanminus is available via apt).
          sudo cpanm --notest --quiet Test::Nginx

      # cp7a: same caching as the build job, keyed on the same mode (debug) --
      # a PR run typically reuses the build job's warm tree on a persistent
      # self-hosted runner.
      - name: Restore build caches
        uses: ./.github/actions/build-cache
        with:
          mode: debug
          nginx-version: ${{ env.NGINX_VERSION }}

      # CI-6: run the Test::Nginx smoke suite against the built dynamic module.
      - name: Build dynamic module
        run: bash ci/tools/ci-build.sh nginx "$NGINX_VERSION"

      # Verify BEFORE the bind, never after: max-port.sh proves the band is
      # below the ephemeral range and not already occupied by a previous run's
      # surviving listener. Run after the bind and a stale listener has already
      # answered the suite, which silently tests the OLD binary.
      - name: Verify test port band is free
        run: bash ci/tools/max-port.sh "$TEST_BASE_PORT" "$TEST_PORT_WIDTH"

      - name: Run ci/t/basic.t
        env:
          # Test::Nginx reads TEST_NGINX_PORT, not TEST_BASE_PORT -- the band
          # declaration above is decoration unless it is passed through here.
          TEST_NGINX_PORT: ${{ env.TEST_BASE_PORT }}
          TEST_NGINX_BINARY: ${{ github.workspace }}/.build/nginx-${{ env.NGINX_VERSION }}-debug/objs/nginx
          TEST_NGINX_LOAD_MODULES: ${{ github.workspace }}/.build/nginx-${{ env.NGINX_VERSION }}-debug/objs/ngx_http_error_abuse_module.so
          # Test::Nginx::Util defaults servroot to "t/servroot" relative to
          # cwd; since the suite moved to ci/t/, the default would try to
          # mkdir a nonexistent t/ at repo root. Point it at the real location.
          TEST_NGINX_SERVROOT: ${{ github.workspace }}/ci/t/servroot
        run: |
          prove -v ci/t/basic.t
