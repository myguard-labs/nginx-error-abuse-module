# sync-sha: d5e50855918dfb198d3f7eebf96c318166cd6787d90c25784832724f7b569944
name: Valgrind

# Valgrind memcheck lite soak on every PR/push — 60s soak so PR feedback stays
# quick. The full memcheck + helgrind soak (600s each) lives in ci-deep.yml
# (monthly cron + workflow_dispatch).
#
# Action pins (keep in sync with build-test.yml header):
# actions/checkout@v5        -> 93cb6efe18208431cddfb8368fd83d5badbf9bfd

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NGINX_VERSION: ""

on:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: valgrind-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  memcheck-lite:
    name: Memcheck lite (60s soak)
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # Was: scrape nginx.org's download page for the highest version and build
      # whatever came back. That made the job unreproducible (the same commit
      # built a different nginx on different days, so a new failure could not
      # be attributed to the diff) and unverifiable -- a version discovered at
      # run time has no digest to check the tarball against, which is exactly
      # what versions.env exists to provide.
      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl libhiredis-dev libpcre2-dev libssl-dev \
            pkg-config valgrind wget zlib1g-dev

      - name: Build debug nginx + error-abuse module
        run: |
          set -euo pipefail
          # Verified against the digest pinned beside the version in
          # versions.env. The bare `wget` this replaces built whatever bytes
          # the network returned, so a compromised or simply changed archive
          # was compiled and run rather than failing the job.
          bash .github/scripts/fetch-verify.sh \
            "https://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz" \
            "$NGINX_VERSION_SHA256" \
            "nginx-${NGINX_VERSION}.tar.gz"
          tar -xzf "nginx-${NGINX_VERSION}.tar.gz"
          cd "nginx-${NGINX_VERSION}"
          ./configure \
            --with-compat --with-debug --with-threads --with-file-aio \
            --with-http_ssl_module --with-http_v2_module \
            --with-http_realip_module --without-http_rewrite_module \
            --with-cc-opt="-DNGX_DEBUG_PALLOC=1 -g3 -O0 -fno-omit-frame-pointer -funwind-tables" \
            --add-module="$GITHUB_WORKSPACE"
          make -j"$(nproc)"

      - name: Memcheck soak (60s @ 4 conc, WITH suppressions)
        env:
          USE_VALGRIND: "1"
        run: |
          bash ci/tools/soak.sh \
            "$GITHUB_WORKSPACE/nginx-${NGINX_VERSION}/objs/nginx" 60 4
