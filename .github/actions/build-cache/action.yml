# sync-sha: 9a23f7310e9771734d3948c65022d213fc32b6bf94f39183dc122627047dd677
name: Build cache
description: Restore verified archives, compiler objects and exact trusted-main trees.

inputs:
  mode:
    description: "Build mode, matching ci-build.sh."
    required: true
  nginx-version:
    description: "Pinned source version."
    required: true
  flavor:
    description: "nginx or angie, matching ci-build.sh."
    required: false
    default: "nginx"

outputs:
  exact-hit:
    description: Fresh exact executable-tree service restore, absent on denied runs.
    value: ${{ steps.executable.outputs.cache-hit }}
  identity:
    description: Expected build identity calculated before restore.
    value: ${{ steps.identity.outputs.build }}

runs:
  using: composite
  steps:
    - name: Ensure ccache, mold and eatmydata are present
      shell: bash
      run: |
        set -euo pipefail
        need=()
        for pkg in ccache mold eatmydata; do
          command -v "$pkg" >/dev/null || need+=("$pkg")
        done
        if [ ${#need[@]} -gt 0 ]; then
          sudo apt-get update
          sudo apt-get install -y "${need[@]}"
        fi
        ccache --version | head -1

    - name: Prepare clean executable target and isolate compiler cache
      id: identity
      shell: bash
      env:
        BUILD_MODE: ${{ inputs.mode }}
        BUILD_FLAVOR: ${{ inputs.flavor }}
        BUILD_VERSION: ${{ inputs.nginx-version }}
      run: |  # zizmor: ignore[github-env] -- CCACHE_DIR has a validated root and locally hashed leaf
        set -euo pipefail
        identity=$(CI_BUILD_CACHE_PREPARE_ONLY=1 bash ci/tools/ci-build.sh "$BUILD_FLAVOR" "$BUILD_VERSION" "$BUILD_MODE")
        scope=$(printf '%s\n' "$GITHUB_REPOSITORY" "$GITHUB_REF" | sha256sum | cut -d' ' -f1)
        echo "build=$identity" >> "$GITHUB_OUTPUT"
        echo "scope=$scope" >> "$GITHUB_OUTPUT"
        # Start empty even on persistent runners. PRs neither restore nor save
        # compiler objects: ref-scoped Actions entries cannot cross into pushes,
        # and no on-disk cache from an earlier job is accepted implicitly.
        # Cache service versions include the path: keep it stable across runs,
        # including compatible-object fallbacks after the build identity changes.
        # Require a canonical absolute parent so cleanup cannot traverse a link,
        # escape via .., or inject another GITHUB_ENV/output entry.
        runner_temp=${RUNNER_TEMP:-}
        if [[ "$runner_temp" != /* || "$runner_temp" == / ||
              "$runner_temp" == *$'\n'* || "$runner_temp" == *$'\r'* ]] ||
           [[ ! -d "$runner_temp" || "$runner_temp" != "$(realpath -e -- "$runner_temp")" ]]; then
          echo "invalid RUNNER_TEMP for compiler cache" >&2
          exit 2
        fi
        variant=$(printf '%s\0' "$BUILD_MODE" "$BUILD_FLAVOR" "$BUILD_VERSION" | sha256sum | cut -d' ' -f1)
        cache_dir="$runner_temp/ea-ccache-$scope-$variant"
        if [[ -L "$cache_dir" || ( -e "$cache_dir" && ! -d "$cache_dir" ) ]]; then
          echo "unsafe compiler cache target" >&2
          exit 2
        fi
        # Remove only this ref/variant's disk state; rm does not follow links
        # inside the old directory. Other repositories and variants stay intact.
        rm -rf -- "$cache_dir"
        mkdir -m 700 -- "$cache_dir"
        echo "CCACHE_DIR=$cache_dir" >> "$GITHUB_ENV"
        echo "path=$cache_dir" >> "$GITHUB_OUTPUT"

    - name: Restore trusted-ref ccache
      if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.identity.outputs.path }}
        key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.scope }}-${{ inputs.mode }}-${{ inputs.flavor }}-${{ inputs.nginx-version }}-${{ steps.identity.outputs.build }}-${{ github.sha }}
        # The wider fallback is compiler objects only: ccache checks compiler
        # content, source/header bytes and flags for each object. It preserves
        # compatible core objects after a module edit, within this trusted ref
        # and variant. Executable trees never use a prefix fallback.
        restore-keys: |
          ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.scope }}-${{ inputs.mode }}-${{ inputs.flavor }}-${{ inputs.nginx-version }}-${{ steps.identity.outputs.build }}-
          ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.scope }}-${{ inputs.mode }}-${{ inputs.flavor }}-${{ inputs.nginx-version }}-

    # Every restored archive is SHA-256 verified by fetch-verify.sh before tar.
    - name: Cache source tarball
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .build/${{ inputs.flavor }}-${{ inputs.nginx-version }}.tar.gz
        key: src-${{ inputs.flavor }}-${{ inputs.nginx-version }}-${{ hashFiles('.github/versions.env') }}

    # Only these events on the default branch may produce/consume executable
    # caches. PR merge refs can shadow default-branch keys, so PRs are denied.
    # The target was deleted above: no old disk tree can impersonate a restore.
    # No prefix fallback: every executable byte requires the exact input key.
    - name: Restore exact trusted-main executable tree
      id: executable
      if: >-
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch')
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.identity.outputs.tree }}
        key: executable-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.scope }}-${{ steps.identity.outputs.build }}
